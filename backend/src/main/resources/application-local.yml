spring:
  datasource:
    url: jdbc:h2:file:./storage/data/trustvault-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        schema_management:
          check_constraint:
            disable: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
