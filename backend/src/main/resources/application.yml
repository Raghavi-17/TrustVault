server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: TRUSTVAULT_SESSION
        http-only: true
        secure: ${TRUSTVAULT_SECURITY_COOKIE_SECURE:false}
        same-site: ${TRUSTVAULT_SECURITY_COOKIE_SAMESITE:Lax}

spring:
  application:
    name: trustvault-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

trustvault:
  storage:
    type: ${TRUSTVAULT_STORAGE_TYPE:local}
    local-dir: ${TRUSTVAULT_STORAGE_LOCAL_DIR:./storage/documents}
    max-file-size-bytes: 15728640
  cors:
    allowed-origins: ${TRUSTVAULT_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
